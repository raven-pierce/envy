- defaults:
    link:
      relink: true
      create: true
    shell:
      stdout: true
      stderr: true

- link:
    ~/.config/yabai: configs/yabai
    ~/.config/skhd: configs/skhd
    ~/.config/sketchybar: configs/sketchybar
    ~/.config/borders: configs/borders

- shell:
    - description: "Set executable permissions for window manager configs"
      command: |
        [ -f ~/.config/yabai/yabairc ] && chmod +x ~/.config/yabai/yabairc
        [ -f ~/.config/skhd/skhdrc ] && chmod +x ~/.config/skhd/skhdrc
        [ -f ~/.config/sketchybar/sketchybarrc ] && chmod +x ~/.config/sketchybar/sketchybarrc
      stdout: true
      stderr: true
