<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }

  .banner {
    position: relative;
    width: 1280px;
    height: 360px;
    background:
      radial-gradient(120% 140% at 12% 18%, #171b24 0%, #0d1117 55%);
    overflow: hidden;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }

  /* faint dotted nest texture, upper-right */
  .banner::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(#ffffff 1px, transparent 1.4px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(60% 90% at 100% 0%, #000 0%, transparent 62%);
            mask-image: radial-gradient(60% 90% at 100% 0%, #000 0%, transparent 62%);
    opacity: 0.05;
  }

  .accent-line {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #f778ba 0%, #f778ba 22%, transparent 60%);
  }

  .content {
    position: absolute;
    left: 92px; top: 50%; transform: translateY(-50%);
  }

  .wordmark {
    font-weight: 700;
    font-size: 118px;
    letter-spacing: -4px;
    color: #f0f6fc;
    line-height: 1;
  }
  .wordmark .dot { color: #f778ba; }

  .tagline {
    margin-top: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 21px;
    letter-spacing: 0.2px;
    color: #8b949e;
  }
  .tagline .accent { color: #f778ba; }

  .chips {
    margin-top: 26px;
    display: flex; gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: #7d8590;
  }
  .chip {
    padding: 6px 13px;
    border: 1px solid #21262d;
    border-radius: 999px;
    background: #0f141b;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="accent-line"></div>
    <div class="content">
      <div class="wordmark">roost<span class="dot">.</span></div>
      <div class="tagline">a macOS dev environment you can <span class="accent">make your own</span></div>
      <div class="chips">
        <span class="chip">homebrew</span>
        <span class="chip">shell</span>
        <span class="chip">dotfiles</span>
        <span class="chip">yabai</span>
        <span class="chip">sketchybar</span>
      </div>
    </div>
  </div>
</body>
</html>
