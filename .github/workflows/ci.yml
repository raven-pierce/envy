name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install tools
        # NOTE: do NOT install gum — the fallback tests require gum absent.
        run: brew install shellcheck shfmt bats-core
      - name: Lint
        run: make lint
      - name: Format check
        run: make fmt-check
      - name: Test
        run: make test
